<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Base Converter — Prof. Carello</title>
    <meta
      name="description"
      content="Basi numeriche e codifiche: convertitore con passaggi svolti, aritmetica in base, complemento a due, IEEE 754, ASCII/Unicode, palestra di esercizi e verifiche."
    />

    <!-- Carello shell (top bar + launcher). Rimuovi questo script per rollback. -->
    <script src="https://auth.nicolocarello.it/carello-shell.js"
            crossorigin="anonymous" defer></script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e0662b" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Base Converter" />
    <script>
      (function () {
        try {
          // Ordine di precedenza del tema, identico in tutte le app:
          //   1. cookie nc_theme su .nicolocarello.it  -> la verita' CONDIVISA
          //   2. localStorage nc_theme                 -> cache locale, evita il lampeggio
          //   3. vecchia chiave dell'app               -> migrazione una tantum
          // Il cookie vince sempre: senza, cambiando tema in un'app le altre
          // resterebbero sulla loro copia vecchia e si contraddirebbero.
          // Questo blocco e' duplicato per necessita' (deve girare prima del
          // primo paint, quindi inline): se lo cambi, cambialo in tutte le app.
          // Vedi AUTH/CARELLO-SHELL.md.
          var cond = (document.cookie.match(/(?:^|;\s*)nc_theme=(light|dark)/) || [])[1];
          var stored = cond || localStorage.getItem('nc_theme') || localStorage.getItem('bc_theme');
          if (stored) localStorage.setItem('nc_theme', stored);
          var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
